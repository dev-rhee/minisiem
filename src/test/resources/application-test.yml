spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

siem:
  log:
    sources:
      - path: /tmp/test
        type: NGINX
        pattern: "*.log"
  admin:
    username: admin
    password: admin1234
